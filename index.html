---
layout: default
title: Niche Mobile Apps & Beta Testing
---

<header>
    <div class="profile-img">
        <i class="fa-solid fa-user-astronaut"></i>
    </div>
    <h2>Hi, I'm Oleksandr</h2>
    <p class="about-text">
        {{ site.description }}
        <br>
        Below you can find my current projects.
    </p>
</header>

<section id="apps">
    <h2><i class="fa-solid fa-rocket"></i> My Apps</h2>
    <div class="apps-grid">

        <!-- Ciclo dinamico sulle app -->
        {% for app in site.apps %}
        <article class="app-card">
            <div class="app-card-header">
                <img src="{{ app.icon | relative_url }}" alt="{{ app.title }} Icon" class="app-card-icon">
                <h3>{{ app.title }}</h3>
            </div>
            <p class="app-description">
                {{ app.description }}
            </p>
            <a href="{{ app.url | relative_url }}" class="btn-main">
                Learn more <i class="fa-solid fa-arrow-right"></i>
            </a>
        </article>
        {% endfor %}

        <!-- Card statica "Coming Soon" -->
        <article class="app-card placeholder">
            <div class="app-icon"><i class="fa-solid fa-plus"></i></div>
            <h3>Coming Soon</h3>
            <p>Next Project!</p>
        </article>
    </div>
</section>
