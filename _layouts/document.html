---
layout: default
body_class: always-light
---
{% assign lang = page.lang | default: "en" %}
{% assign t = site.data[lang] %}

<div class="back-link">
  {% capture home_url %}{% if page.lang == 'it' %}/it/{% else %}/{% endif %}{% endcapture %}
  <a href="{{ home_url | relative_url }}">
    <i class="fa-solid fa-arrow-left"></i> {{ t.back_to_home }}
  </a>
</div>

<div class="policy-content">
  {{ content }}
</div>
