---
layout: default
---
<div class="back-link" style="margin-bottom: 30px;">
    <a href="{{ '/' | relative_url }}">
        <i class="fa-solid fa-arrow-left"></i> Back to Home
    </a>
</div>

<article class="app-page-container">
    <!-- Intestazione dell'App -->
    <header class="app-page-header">
        {% if page.icon %}
        <img src="{{ page.icon | relative_url }}" alt="{{ page.title }} Icon" class="app-page-icon">
        {% endif %}
        <div class="app-page-title-group">
            <h1>{{ page.title }}</h1>
            <p class="app-page-subtitle">{{ page.description }}</p>
        </div>
    </header>

    <!-- Pulsanti e link (Play Store e Privacy Policy) -->
    <div class="app-page-actions">
        {% if page.play_store_link %}
        <a href="{{ page.play_store_link }}" class="btn-main" target="_blank">
            Get it on Play Store <i class="fa-brands fa-google-play"></i>
        </a>
        {% endif %}

        {% if page.privacy_policy %}
        <div class="policy-link-wrapper">
            <a href="{{ page.privacy_policy | relative_url }}">Privacy Policy</a>
        </div>
        {% endif %}
    </div>

    <hr class="app-divider">

    <!-- Contenuto in Markdown inserito nel file .md dell'app -->
    <div class="app-page-content">
        {{ content }}
    </div>
</article>
