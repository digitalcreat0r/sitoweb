<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>

    <meta name="description" content="{{ site.description }}">
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebSite",
            "name": "CleverPocket Dev",
            "url": "https://cleverpocket.app"
        }
    </script>
    <link rel="icon" type="image/png" href="{{ '/assets/images/favicon.png' | relative_url }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body class="{{ page.body_class }} {{ layout.body_class }} {% if site.maintenance_mode and page.hide_maintenance != true %}maintenance-on{% endif %}">

{% if site.maintenance_mode and page.hide_maintenance != true %}
<div class="maintenance-banner">
    <i class="fa-solid fa-wrench"></i> {{ site.maintenance_message }}
</div>
{% endif %}

{% include header.html %}

<div class="container">
    {{ content }}
    {% include footer.html %}
</div>

<script>
    const themeToggle = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    const body = document.body;

    if (themeToggle) {
        function updateIcon(isLight) {
            themeIcon.className = isLight ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
        }

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            body.classList.add('light-mode');
            updateIcon(true);
        }

        themeToggle.addEventListener('click', () => {
            body.classList.toggle('light-mode');
            const isLight = body.classList.contains('light-mode');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            updateIcon(isLight);
        });
    }
</script>

<script>
    // Aspetta che la pagina sia completamente caricata
    document.addEventListener("DOMContentLoaded", function() {
        const images = document.querySelectorAll('img:not([loading])');

        // Aggiungi loading="lazy" a ciascuna di esse
        images.forEach(img => {
            img.setAttribute('loading', 'lazy');
        });
    });
</script>

<script>
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function (e) {
            const targetId = this.getAttribute('href');
            if (targetId === '#') return;

            const targetElement = document.querySelector(targetId);

            if (targetElement) {
                e.preventDefault();

                // Impostazioni
                const offset = 40;
                const duration = 2000; // Modifica qui!

                const targetPosition = targetElement.getBoundingClientRect().top + window.pageYOffset - offset;
                const startPosition = window.pageYOffset;
                const distance = targetPosition - startPosition;
                let start = null;

                function step(timestamp) {
                    if (!start) start = timestamp;
                    const progress = timestamp - start;

                    const easeInOutCubic = progress < duration / 2
                        ? 4 * Math.pow(progress / duration, 3)
                        : 1 - Math.pow(-2 * (progress / duration) + 2, 3) / 2;

                    window.scrollTo(0, startPosition + distance * easeInOutCubic);

                    if (progress < duration) {
                        window.requestAnimationFrame(step);
                    } else {
                        window.scrollTo(0, targetPosition);
                    }
                }
                window.requestAnimationFrame(step);
            }
        });
    });
</script>

</body>
</html>
